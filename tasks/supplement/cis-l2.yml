---
# StigForge supplement for rhel8_cis - not overwritten by `stigforge generate`.

# sshd_limit_user_access (cis, cis_server_l1). The rule is satisfied by exactly one of AllowUsers,
# AllowGroups, DenyUsers or DenyGroups in sshd_config. A cloud image cannot know a site's user
# policy, so this adds the one restriction that never affects a customer: root is denied by name
# (root login is already off via PermitRootLogin no). The same task rhel9_cis and rhel10_cis carry;
# customers who want AllowGroups set it themselves. Documented in the POA&M, NOT an exemption.
- name: Limit sshd user access by denying root by name (sshd_limit_user_access)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*DenyUsers\s'
    line: 'DenyUsers root'
    insertbefore: '^\s*Match\s'
    firstmatch: true
    state: present
    validate: /usr/sbin/sshd -t -f %s
  tags:
  - sshd_limit_user_access
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# use_pam_wheel_group_for_su (cis, cis_server_l1). /etc/pam.d/su lacked the pam_wheel line on
# rhel-8:cis-l1 / cis-l2 (stigready legs b3a460ad3a47 / 652ef1f391e5, 2026-10-18): the playbook
# creates the empty group but never writes the line. The RHEL 8 OVAL wants
# `auth required pam_wheel.so ... use_uid` with `group=` equal to var_pam_wheel_group_for_su
# (sugroup in this role's defaults). Only members of the group may su; cloud users use sudo, and the
# group is empty by design (CIS). Same pair as rhel9_cis.
- name: Ensure the group used by pam_wheel for su exists
  ansible.builtin.group:
    name: sugroup
    state: present
  tags:
  - use_pam_wheel_group_for_su
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

- name: Restrict su to the sugroup group with pam_wheel (use_pam_wheel_group_for_su)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*auth\s+required\s+pam_wheel\.so'
    line: 'auth            required        pam_wheel.so use_uid group=sugroup'
    insertafter: '^#?\s*auth\s+required\s+pam_wheel\.so'
    state: present
  tags:
  - use_pam_wheel_group_for_su
  - configure_strategy
  - low_complexity
  - low_disruption
  - medium_severity
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# systemd-journal-upload stays off. service_systemd-journal-upload_enabled is policy-exempt (remote log offload: an AMI has
# no upload URL). When the role enabled it, the unit ended failed, and its first start (DynamicUser) left
# /var/lib/private/systemd/journal-upload owned by a dynamic uid/gid (63150), which also failed
# no_files_or_dirs_unowned_by_user and no_files_or_dirs_ungroupowned (stigready rhel-8:cis-l1 leg b3a460ad3a47,
# rhel-8:cis-l2 leg 652ef1f391e5, 2026-10-18). Stop and disable the unit if it exists, and remove that state directory and
# its /var/lib/systemd symlink. No rule-id tag on purpose: a product fix to this role's own side effect.
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Gather service facts for systemd-journal-upload
  ansible.builtin.service_facts:
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Stop and disable systemd-journal-upload (no upload URL in an AMI)
  ansible.builtin.systemd:
    name: systemd-journal-upload
    state: stopped
    enabled: false
  when: "'systemd-journal-upload.service' in ansible_facts.services"
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Remove the dynamic-user state left by systemd-journal-upload
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
  - /var/lib/systemd/journal-upload
  - /var/lib/private/systemd/journal-upload
  tags:
  - low_disruption
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# systemd-journal-remote's service account (/sbin/nologin) has its home in /var/log/journal/remote. Installing the package
# (`Ensure systemd-journal-remote is installed`) after this role has turned on home creation copies /etc/skel there, leaving
# .bash_logout/.bash_profile/.bashrc at 0644 in /var/log, which file_permissions_var_log_stig forbids and the factory's
# shipped-state check failed on (stigready rhel-9:cis-l2, 2026-10-16). A nologin account needs no shell init files: remove
# them. No rule-id tag on purpose (a product fix to this role's own side effect, not a per-rule opt-out).
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Find shell init files in the systemd-journal-remote home
  ansible.builtin.find:
    paths: /var/log/journal/remote
    hidden: true
    file_type: file
    patterns:
    - .bash_logout
    - .bash_profile
    - .bashrc
    - .cshrc
    - .kshrc
    - .tcshrc
    - .zshrc
  register: stigforge_journal_remote_skel
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Remove shell init files from the systemd-journal-remote home under /var/log
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stigforge_journal_remote_skel.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  tags:
  - low_disruption
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# /var/log/tuned/tuned.log. stigready rhel-8:cis-l1 (leg 2a4cb545391b) and rhel-8:cis-l2 (leg 90d7515e7be3), 2026-10-19, failed the
# hardened-image /var/log check (`find -P /var/log/ -perm /u+xs,g+xws,o+xwrt`, i.e. log files 0640 or stricter, the mode SSG's
# file_permissions_var_log_stig OVAL requires) on /var/log/tuned/tuned.log only. tuned is an OS service: it opens its log with the
# service's default umask (022), and its own size-based rotation recreates the file the same way, so a one-time chmod would drift.
# Fix it at the source: a drop-in gives tuned.service UMask=0027 (new and rotated files 0640), and the files already on disk are
# brought to 0640 or stricter. systemd ignores the drop-in when tuned is not installed. No rule-id tag on purpose: the RHEL 8 CIS
# profile has no file-level /var/log permission rule; this is a product guarantee, not a per-rule opt-out.
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Create the tuned.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tuned.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Give tuned a 0027 umask so tuned.log is created and rotated 0640
  ansible.builtin.copy:
    dest: /etc/systemd/system/tuned.service.d/50-stigready-umask.conf
    content: |
      # StigReady: tuned writes /var/log/tuned/tuned.log (and its rotations) with the service umask.
      # Hardened images keep /var/log files 0640 or stricter.
      [Service]
      UMask=0027
    owner: root
    group: root
    mode: '0644'
  register: stigforge_tuned_umask_dropin
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Reload systemd after the tuned drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: stigforge_tuned_umask_dropin is changed
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Restart tuned so the running service uses the new umask
  ansible.builtin.systemd:
    name: tuned
    state: restarted
  when:
  - stigforge_tuned_umask_dropin is changed
  - "'tuned' in ansible_facts.packages"
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Find the existing tuned logs
  ansible.builtin.find:
    paths: /var/log/tuned
    patterns: 'tuned.log*'
  register: stigforge_tuned_logs
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | Set the existing tuned logs to 0640 or stricter
  ansible.builtin.file:
    path: '{{ item.path }}'
    mode: u-xs,g-wxs,o-rwxt
  loop: '{{ stigforge_tuned_logs.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'
  tags:
  - low_disruption
  - no_reboot_needed

# ---------------------------------------------------------------------------------------------
# Leave auditd running. The generated rules restart auditd after editing them (`service auditd restart`, more than once per role);
# on rhel-9-arm64:cis-l2 (stigready, 2026-10-16) the second restart 14 s after the first stopped auditd and never started it. With
# the rules immutable (-e 2) and nothing reading events, the audit backlog fills and every audited syscall waits, which wedged new
# SSH sessions for an hour. Start it if needed (a no-op when running), then require a live auditd pid or fail the build.
# No rule-id tag on purpose: a product guarantee about the role's own side effects, not a per-rule opt-out.
# ---------------------------------------------------------------------------------------------
- name: Product hardening | Ensure auditd is running after the role's audit changes
  # RHEL 10 CIS L1 does not install audit (rhel-10:cis-l1 leg b1a2dace6686: auditctl not found); only where auditd exists.
  when: "'audit' in ansible_facts.packages"
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  tags:
  - low_disruption
  - no_reboot_needed

- name: Product hardening | auditd must be running (a stopped auditd with immutable rules wedges every audited syscall)
  # RHEL 10 CIS L1 does not install audit (rhel-10:cis-l1 leg b1a2dace6686: auditctl not found); only where auditd exists.
  when: "'audit' in ansible_facts.packages"
  ansible.builtin.command: auditctl -s
  register: stigforge_auditd_status
  changed_when: false
  until: stigforge_auditd_status.stdout is regex('(?m)^pid [1-9][0-9]*$')
  retries: 12
  delay: 10
  tags:
  - low_disruption
  - no_reboot_needed
