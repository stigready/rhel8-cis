# Imported by StigForge; cloud-breaker tasks stripped per policy/cloud-ami.yml
stigforge_role: rhel8_cis
stigforge_profile: cis-l1
stigforge_rules_enabled: true
stigforge_min_score: 90
stigforge_ssg_datastream: ssg-rhel8-ds.xml
stigforge_ssg_profile: xccdf_org.ssgproject.content_profile_cis_server_l1
inactivity_timeout_value: '900'
var_screensaver_lock_delay: '5'
var_sudo_logfile: /var/log/sudo.log
var_sudo_timestamp_timeout: '15'
var_authselect_profile: sssd
cis_banner_text: Authorized users only. All activity may be monitored and reported.
dconf_login_banner_contents: Authorized uses only. All activity may be monitored and reported.
var_password_pam_remember: '24'
var_password_pam_remember_control_flag: requisite,required
var_accounts_passwords_pam_faillock_deny: '5'
var_accounts_passwords_pam_faillock_unlock_time: '900'
var_password_pam_dictcheck: '1'
var_password_pam_difok: '2'
var_password_pam_maxrepeat: '3'
var_password_pam_maxsequence: '3'
var_password_pam_minlen: '14'
var_password_hashing_algorithm: YESCRYPT|SHA512
var_password_hashing_algorithm_pam: yescrypt|sha512
var_account_disable_post_pw_expiration: '45'
var_accounts_maximum_age_login_defs: '365'
var_accounts_password_warn_age_login_defs: '7'
var_pam_wheel_group_for_su: sugroup
var_accounts_tmout: '900'
var_user_initialization_files_regex: ^\.[\w\- ]+$
var_accounts_user_umask: '027'
sysctl_net_ipv6_conf_all_accept_ra_value: '0'
sysctl_net_ipv6_conf_all_accept_redirects_value: '0'
sysctl_net_ipv6_conf_all_accept_source_route_value: '0'
sysctl_net_ipv6_conf_all_forwarding_value: '0'
sysctl_net_ipv6_conf_default_accept_ra_value: '0'
sysctl_net_ipv6_conf_default_accept_redirects_value: '0'
sysctl_net_ipv6_conf_default_accept_source_route_value: '0'
sysctl_net_ipv6_conf_default_forwarding_value: '0'
sysctl_net_ipv4_conf_all_accept_redirects_value: '0'
sysctl_net_ipv4_conf_all_accept_source_route_value: '0'
sysctl_net_ipv4_conf_all_forwarding_value: '0'
sysctl_net_ipv4_conf_all_log_martians_value: '1'
sysctl_net_ipv4_conf_all_rp_filter_value: '1'
sysctl_net_ipv4_conf_all_secure_redirects_value: '0'
sysctl_net_ipv4_conf_default_accept_redirects_value: '0'
sysctl_net_ipv4_conf_default_accept_source_route_value: '0'
sysctl_net_ipv4_conf_default_forwarding_value: '0'
sysctl_net_ipv4_conf_default_log_martians_value: '1'
sysctl_net_ipv4_conf_default_rp_filter_value: '1'
sysctl_net_ipv4_conf_default_secure_redirects_value: '0'
sysctl_net_ipv4_icmp_echo_ignore_broadcasts_value: '1'
sysctl_net_ipv4_icmp_ignore_bogus_error_responses_value: '1'
sysctl_net_ipv4_tcp_syncookies_value: '1'
var_selinux_policy_name: targeted
var_postfix_inet_interfaces: loopback-only
var_multiple_time_servers: 0.rhel.pool.ntp.org,1.rhel.pool.ntp.org,2.rhel.pool.ntp.org,3.rhel.pool.ntp.org
var_sshd_set_keepalive: '1'
sshd_idle_timeout_value: '300'
var_sshd_set_login_grace_time: '60'
sshd_max_auth_tries_value: '4'
var_sshd_max_sessions: '10'
var_sshd_set_maxstartups: 10:30:60
var_selinux_state: enforcing
var_audit_backlog_limit: '8192'
var_accounts_passwords_pam_faillock_dir: /var/run/faillock
var_auditd_disk_error_action: syslog|single|halt
var_auditd_disk_full_action: single|halt
var_auditd_admin_space_left_action: single|halt
var_auditd_max_log_file: '8'
var_auditd_max_log_file_action: keep_logs
var_auditd_space_left_action: email|exec|single|halt
